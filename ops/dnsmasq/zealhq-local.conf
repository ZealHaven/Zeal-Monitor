# /etc/dnsmasq.d/<tailnet-domain>.conf
# Installed by: just dns
#
# Tailscale split DNS routes queries for the zone `<tailnet-domain>` to this box
# (nameserver <tailscale-ip> in the admin console). dnsmasq answers the whole
# zone with the tailscale IP, so every <name>.<tailnet-domain> reaches this
# machine and nginx routes by Host header.
#
# Add a new tailnet app by adding <name>.<tailnet-domain> to its nginx server_name;
# no DNS change needed (wildcard).

# Only the tailscale interface; never clashes with systemd-resolved on
# 127.0.0.53/54:53.
listen-address=<tailscale-ip>
bind-interfaces

# This instance is authoritative for the zone only; it receives zone queries
# exclusively (restricted nameserver), so no upstream forwarding is needed.
no-resolv
domain-needed

# Wildcard: <anything>.<tailnet-domain> -> this machine
address=/<tailnet-domain>/<tailscale-ip>
