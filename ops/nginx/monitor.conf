# /etc/nginx/sites-enabled/monitor.conf
# Installed by: just nginx
server {
    listen 80;
    # <local-hostname>  -> this machine (via /etc/hosts)
    # <tailnet-domain>   -> tailnet raw hostname
    # monitor.<tailnet-domain> -> tailnet (via split DNS -> dnsmasq)
    # monitor.<tailnet-domain-2> -> tailnet (optional second domain)
    server_name monitor.local;

    location / {
        proxy_pass http://127.0.0.1:9050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        # HMR + SSE + websockets (chat streaming)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
